[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drupal-api-client"
version = "0.3.0"
description = "Python port of @drupal-api-client/api-client — base HTTP client for Drupal APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
dependencies = ["httpx>=0.27"]
authors = [{ name = "Vincenzo Gambino" }]
keywords = ["drupal", "api", "api-client", "jsonapi", "json-api", "decoupled", "decoupled-drupal", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/VincenzoGambino/drupal-api-client-python"
Repository = "https://github.com/VincenzoGambino/drupal-api-client-python"
Issues = "https://github.com/VincenzoGambino/drupal-api-client-python/issues"
Changelog = "https://github.com/VincenzoGambino/drupal-api-client-python/blob/main/CHANGELOG.md"
Source = "https://github.com/drupal-api-client/drupal-api-client"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.20", "ruff>=0.4", "mypy>=1.10", "build>=1.2", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/drupal_api_client"]

[tool.ruff]
# Pinned explicitly: `ruff check` with no config uses the installed ruff's
# *default* rule set, which changes between releases. CI installs `ruff>=0.4`
# (i.e. the newest), so an unconfigured run can start failing on a rule that
# simply graduated into the defaults - which is exactly how RUF022 broke a
# green local run. Selecting rules here makes local and CI agree.
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: requires a running Drupal site (see tests/test_live_integration.py); skipped unless DRUPAL_API_CLIENT_LIVE_BASE_URL is set",
]
