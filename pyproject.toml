[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drupal-api-client"
version = "0.3.1"
description = "Python port of @drupal-api-client/api-client — base HTTP client for Drupal APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
dependencies = ["httpx>=0.27"]
authors = [{ name = "Vincenzo Gambino" }]
keywords = ["drupal", "api", "api-client", "jsonapi", "json-api", "decoupled", "decoupled-drupal", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/VincenzoGambino/drupal-api-client-python"
Repository = "https://github.com/VincenzoGambino/drupal-api-client-python"
Issues = "https://github.com/VincenzoGambino/drupal-api-client-python/issues"
Changelog = "https://github.com/VincenzoGambino/drupal-api-client-python/blob/main/CHANGELOG.md"
Source = "https://github.com/drupal-api-client/drupal-api-client"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.20", "ruff==0.15.12", "mypy>=1.10", "build>=1.2", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/drupal_api_client"]

[tool.ruff]
# Selecting rules explicitly is necessary but NOT sufficient to make local and
# CI agree: which rules a `select` expands to is a property of the ruff binary,
# so a floating `ruff>=x` means a floating gate. Two CI failures came from
# exactly this (RUF022 graduating into the defaults, then RUF036/RUF031
# graduating out of preview). The version is therefore pinned in
# [project.optional-dependencies].dev. Bump it deliberately, not incidentally.
target-version = "py310"

[tool.ruff.lint]
# `preview` is safe to enable *because* the ruff version is pinned in
# [project.optional-dependencies].dev: the rule set is frozen, and satisfying
# preview rules now means a future ruff upgrade graduating them is a no-op
# rather than a broken build.
preview = true
select = ["E4", "E7", "E9", "F", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: requires a running Drupal site (see tests/test_live_integration.py); skipped unless DRUPAL_API_CLIENT_LIVE_BASE_URL is set",
]
